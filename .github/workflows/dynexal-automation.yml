name: Dynexal Website Automation

on:
  push:
    branches: [main]
    paths-ignore:
      - 'api/knowledge.json'
      - 'sitemap.xml'
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintain-site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build AI knowledge index and sitemap
        run: node scripts/build-site-index.mjs

      - name: Apply global plain navigation stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          marker = 'nav-plain.css?v=20260915'
          for path in Path('.').rglob('*.html'):
              if any(part in {'.git','node_modules'} for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              if 'nav-plain.css' in text:
                  continue
              tag = f'<link rel="stylesheet" href="/{marker}">'
              if '</head>' in text:
                  path.write_text(text.replace('</head>', f'  {tag}\n</head>', 1), encoding='utf-8')
                  print(f'Updated {path}')
          PY

      - name: Commit generated files
        run: |
          git config user.name "dynexal-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/knowledge.json sitemap.xml '*.html' nav-plain.css
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: sync global plain navigation"
          git push
