name: Sync Dynexal Navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-navigation:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'chore: sync navigation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize navigation and branding
        run: |
          python3 scripts/sync-navigation.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [p for p in Path('.').rglob('*.html') if '.git' not in p.parts and 'node_modules' not in p.parts]
          changed = 0
          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text
              text = re.sub(r'<span class="logo-mark"[^>]*>.*?</span>', '', text, flags=re.S)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed += 1
          print(f"Removed standalone D logo mark from {changed} HTML pages.")
          PY

      - name: Commit synchronized HTML
        run: |
          git config user.name "dynexal-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html'
          if git diff --cached --quiet; then
            echo "Navigation and branding already synchronized."
            exit 0
          fi
          git commit -m "chore: sync navigation"
          git push
