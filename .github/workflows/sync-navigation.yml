name: Sync Dynexal Navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-navigation:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'chore: sync navigation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical navigation and branding to all HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [p for p in Path('.').rglob('*.html') if '.git' not in p.parts and 'node_modules' not in p.parts]

          def nav_for(path):
              prefix = '../' * len(path.parent.parts)
              home = prefix + 'index.html'
              tutorials = prefix + 'tutorials.html'
              services = prefix + 'services.html'
              portfolio = prefix + 'portfolio.html'
              about = prefix + 'about.html'
              return f'''<nav class="nav" aria-label="Main navigation">
          <a href="{home}">Home</a>
          <a href="{tutorials}">Tutorials</a>
          <a href="{services}">Services</a>
          <a href="{portfolio}">Portfolio</a>
          <a href="{home}#topics">Topics</a>
          <a href="{about}">About</a>
          </nav>'''

          final_nav_css = '''<style id="dynexal-final-nav-fix">
          .site-header .logo{gap:12px}
          .site-header .logo-mark{display:block!important;width:46px!important;height:46px!important;flex:0 0 46px!important;background:url('ASSET_PREFIXassets/dynexal-mark.svg') center/contain no-repeat!important}
          .nav{display:flex;align-items:center;gap:30px;white-space:nowrap;overflow:visible}
          .nav .has-dropdown{position:relative;height:82px;display:flex;align-items:center}
          .nav .has-dropdown>a{height:82px;display:flex;align-items:center;position:relative}
          .nav .has-dropdown>a:after{display:none!important;content:none!important}
          .nav .dropdown-menu{position:absolute;top:calc(100% - 1px);left:50%;transform:translate(-50%,8px);min-width:245px;padding:8px;background:rgba(7,18,34,.99);border:1px solid #29415f;border-radius:12px;box-shadow:0 20px 45px rgba(0,0,0,.38);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .16s ease,transform .16s ease,visibility .16s ease;z-index:1000}
          .nav .dropdown-menu:before{content:"";position:absolute;top:-8px;left:0;right:0;height:8px}
          .nav .dropdown-menu a{display:block!important;height:auto!important;padding:11px 13px;border-radius:8px;color:#cbd8e8;font-size:14px;line-height:1.35;white-space:nowrap}
          .nav .dropdown-menu a:hover,.nav .dropdown-menu a:focus{background:#123258;color:#fff}
          .nav .has-dropdown:hover>.dropdown-menu,.nav .has-dropdown:focus-within>.dropdown-menu{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,0)}
          @media(max-width:900px){
            .nav{display:none}
            .menu-btn{display:block}
            .site-header .logo-mark{width:40px!important;height:40px!important;flex-basis:40px!important}
          }
          </style>'''

          changed = 0
          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text
              text = re.sub(r'<nav class="nav"[^>]*>[\s\S]*?</nav>', nav_for(path), text, count=1)
              text = re.sub(
                  r'(<header[\s\S]*?<a class="logo"[^>]*>)[\s\S]*?(</a>)',
                  r'\1<span class="logo-mark" aria-hidden="true"></span><span class="logo-copy"><strong>Dynexal Technologies</strong><small>Learn | Build | Integrate | Grow</small></span>\2',
                  text,
                  count=1
              )
              prefix = '../' * len(path.parent.parts)
              css = final_nav_css.replace('ASSET_PREFIX', prefix)
              text = re.sub(r'<style id="dynexal-final-nav-fix">[\s\S]*?</style>\s*', '', text)
              text = text.replace('</head>', css + '\n</head>', 1)
              text = re.sub(r'<script\s+src=["\']([^"\']*script\.js)(?:\?[^"\']*)?["\']\s*></script>', r'<script src="\1?v=20260914-nav5"></script>', text)
              restore = '''<script>
          (function(){
            document.querySelectorAll('header .logo').forEach(function(logo){
              if(!logo.querySelector('.logo-mark')){
                var mark=document.createElement('span');
                mark.className='logo-mark';
                mark.setAttribute('aria-hidden','true');
                logo.insertBefore(mark, logo.firstChild);
              }
            });
          })();
          </script>'''
              text = re.sub(r'<script>\s*\(function\(\)\{\s*document\.querySelectorAll\(\'header \.logo\'[\s\S]*?</script>\s*', '', text, count=1)
              text = text.replace('</body>', restore + '\n</body>', 1)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed += 1
          print(f'Updated {changed} HTML pages.')
          PY

      - name: Commit synchronized navigation
        run: |
          git config user.name "dynexal-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "Navigation already synchronized."
            exit 0
          fi
          git commit -m "chore: sync navigation"
          git push
