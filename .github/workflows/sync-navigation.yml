name: Sync Dynexal Navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-navigation:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'chore: sync navigation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical navigation and text-only branding to all HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [p for p in Path('.').rglob('*.html') if '.git' not in p.parts and 'node_modules' not in p.parts]

          def nav_for(path):
              prefix = '../' * len(path.parent.parts)
              home = prefix + 'index.html'
              tutorials = prefix + 'tutorials.html'
              services = prefix + 'services.html'
              portfolio = prefix + 'portfolio.html'
              about = prefix + 'about.html'
              return f'''<nav class="nav" aria-label="Main navigation">
          <a href="{home}">Home</a>
          <a href="{tutorials}">Tutorials</a>
          <a href="{services}">Services</a>
          <a href="{portfolio}">Portfolio</a>
          <a href="{home}#topics">Topics</a>
          <a href="{about}">About</a>
          </nav>'''

          changed = 0
          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text
              text = re.sub(r'<nav class="nav"[^>]*>[\s\S]*?</nav>', nav_for(path), text, count=1)
              text = re.sub(
                  r'(<header[\s\S]*?<a class="logo"[^>]*>)[\s\S]*?(</a>)',
                  r'\1<span class="logo-copy"><strong>Dynexal Technologies</strong><small>Learn | Build | Integrate | Grow</small></span>\2',
                  text,
                  count=1
              )
              text = re.sub(r'<script\s+src=["\']([^"\']*script\.js)(?:\?[^"\']*)?["\']\s*></script>', r'<script src="\1?v=20260914-nav3"></script>', text)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed += 1
          print(f'Updated {changed} HTML pages.')
          PY

      - name: Commit synchronized navigation
        run: |
          git config user.name "dynexal-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "Navigation already synchronized."
            exit 0
          fi
          git commit -m "chore: sync navigation"
          git push
