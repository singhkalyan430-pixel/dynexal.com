name: Sync Dynexal Navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-navigation:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'chore: sync navigation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize navigation and dropdown URLs
        run: python3 scripts/sync-navigation.py

      - name: Commit synchronized HTML
        run: |
          git config user.name "dynexal-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html'
          if git diff --cached --quiet; then
            echo "Navigation already synchronized."
            exit 0
          fi
          git commit -m "chore: sync navigation"
          git push
