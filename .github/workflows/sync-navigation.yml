name: Sync Dynexal Navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-navigation:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'chore: sync navigation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical navigation to all HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [p for p in Path('.').rglob('*.html') if '.git' not in p.parts and 'node_modules' not in p.parts]

          def nav_for(path):
              prefix = '../' * len(path.parent.parts)
              return f'''<nav class="nav" aria-label="Main navigation">
          <a href="{prefix}index.html">Home</a>
          <a href="{prefix}tutorials.html">Tutorials</a>
          <a href="{prefix}services.html">Services</a>
          <a href="{prefix}portfolio.html">Portfolio</a>
          <a href="{prefix}index.html#topics">Topics</a>
          <a href="{prefix}about.html">About</a>
          </nav>'''

          nav_href_fix = '''<script id="dynexal-nav-href-fix">
          (function(){
            document.querySelectorAll('.dropdown-menu a').forEach(function(a){
              var href=a.getAttribute('href');
              if(!href || href[0]=='/' || href[0]=='#' || /^[a-z][a-z0-9+.-]*:/i.test(href)) return;
              a.setAttribute('href','/' + href.replace(/^\.\//,''));
            });
          })();
          </script>'''

          changed = 0
          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text
              text = re.sub(r'<nav class="nav"[^>]*>[\s\S]*?</nav>', nav_for(path), text, count=1)
              text = re.sub(r'<script id="dynexal-nav-href-fix">[\s\S]*?</script>\s*', '', text)
              text = re.sub(r'<script\s+src=["\']([^"\']*script\.js)(?:\?[^"\']*)?["\']\s*></script>', r'<script src="\1?v=20260915-navfix"></script>', text)
              text = text.replace('</body>', nav_href_fix + '\n</body>', 1)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed += 1
          print(f"Updated {changed} HTML pages.")
          PY

      - name: Commit synchronized navigation
        run: |
          git config user.name "dynexal-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "Navigation already synchronized."
            exit 0
          fi
          git commit -m "chore: sync navigation"
          git push
