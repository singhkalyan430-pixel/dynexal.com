name: Sync Dynexal Navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-navigation:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'chore: sync navigation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply navigation to all HTML pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          files = [p for p in root.rglob('*.html') if '.git' not in p.parts and 'node_modules' not in p.parts]

          def nav_for(path):
              depth = len(path.parent.parts)
              prefix = '../' * depth
              home = prefix + 'index.html'
              tutorials = prefix + 'tutorials.html'
              services = prefix + 'services.html'
              portfolio = prefix + 'portfolio.html'
              about = prefix + 'about.html'
              return f'''<nav class="nav" aria-label="Main navigation">
          <a href="{home}">Home</a>
          <div class="nav-item"><a href="{tutorials}">Tutorials <span class="nav-arrow">▼</span></a><div class="nav-dropdown"><div class="dropdown-label">LEARN BY CATEGORY</div><a href="{prefix}articles/getting-started-with-al.html">AL Development</a><a href="{prefix}articles/business-central-api-integration.html">APIs &amp; Integrations</a><a href="{prefix}articles/rdlc-reports-business-central.html">Reports &amp; RDLC</a><a href="{prefix}articles/shopify-business-central-integration.html">E-commerce &amp; Shopify</a><a href="{prefix}articles/ai-business-central-complete-guide.html">AI + Business Central</a><a class="dropdown-viewall" href="{tutorials}">View All Tutorials →</a></div></div>
          <div class="nav-item"><a href="{services}">Services <span class="nav-arrow">▼</span></a><div class="nav-dropdown"><div class="dropdown-label">DYNEXAL SERVICES</div><a href="{services}#development">AL Development</a><a href="{services}#integration">API &amp; Integrations</a><a href="{services}#reporting">RDLC &amp; Reporting</a><a href="{services}#ai">AI &amp; Automation</a><a class="dropdown-viewall" href="{services}">View Services →</a></div></div>
          <div class="nav-item"><a href="{portfolio}">Portfolio <span class="nav-arrow">▼</span></a><div class="nav-dropdown"><div class="dropdown-label">PROJECTS</div><a href="{prefix}projects/ecommerce-integration.html">E-commerce Integration</a><a href="{prefix}projects/role-center-dashboard.html">Role Center Dashboard</a><a href="{prefix}projects/rdlc-reporting-toolkit.html">Reporting Toolkit</a><a href="{prefix}projects/api-integration.html">API Integration</a><a class="dropdown-viewall" href="{portfolio}">View Portfolio →</a></div></div>
          <div class="nav-item"><a href="{home}#topics">Topics <span class="nav-arrow">▼</span></a><div class="nav-dropdown"><div class="dropdown-label">LEARNING PATHS</div><a href="{prefix}topics/al-development.html">AL Development</a><a href="{prefix}topics/al-development.html">Tables &amp; Pages</a><a href="{prefix}topics/rdlc-business-central.html">Reports &amp; RDLC</a><a href="{prefix}topics/business-central-api.html">APIs &amp; Integrations</a><a href="{prefix}articles/shopify-business-central-integration.html">E-commerce Projects</a><a href="{prefix}articles/ai-business-central-complete-guide.html">AI + Business Central</a></div></div>
          <a href="{about}">About</a></nav>'''

          changed = 0
          for path in files:
              text = path.read_text(encoding='utf-8')
              new_nav = nav_for(path)
              new_text, count = re.subn(r'<nav class="nav"[^>]*>[\s\S]*?</nav>', new_nav, text, count=1)
              if count and new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed += 1
          print(f'Navigation synchronized on {changed} HTML pages.')
          PY

      - name: Commit navigation changes
        run: |
          git config user.name "dynexal-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "Navigation already synchronized."
            exit 0
          fi
          git commit -m "chore: sync navigation"
          git push
