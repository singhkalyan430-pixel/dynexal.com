name: Dynexal Website Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Static link and SEO audit
        run: python3 tests/static-link-check.py

  browser-smoke:
    needs: static-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for GitHub Pages deployment
        run: sleep 45
      - name: Install Playwright Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Run browser smoke tests
        run: npx --yes playwright@1.55.0 test tests/site-smoke.spec.mjs --reporter=line
