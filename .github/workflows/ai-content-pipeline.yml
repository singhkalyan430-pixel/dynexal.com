name: Dynexal AI Content Draft

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: read

concurrency:
  group: dynexal-content-draft
  cancel-in-progress: false

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate article with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            echo "Gemini generation attempt $attempt/5"
            if node scripts/generate-article.mjs; then exit 0; fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 15)); fi
          done
          exit 1

      - name: Build draft indexes
        run: |
          node scripts/add-tutorial-visuals.mjs
          node scripts/build-site-index.mjs
          node --check scripts/generate-article.mjs
          node --check scripts/add-tutorial-visuals.mjs
          node --check scripts/build-site-index.mjs
          test -s sitemap.xml
          test -s tutorials.html
          test -s api/knowledge.json

      - name: Package draft for human review
        run: |
          mkdir -p dynexal-ai-draft
          cp -r articles tutorials.html sitemap.xml api/knowledge.json content-queue.json assets/tutorial-diagrams dynexal-ai-draft/
          printf 'AI-generated content draft. Review and manually publish approved changes.\n' > dynexal-ai-draft/REVIEW_REQUIRED.txt

      - name: Upload draft artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynexal-ai-content-draft
          path: dynexal-ai-draft
          retention-days: 14
