name: Dynexal AI Content Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dynexal-content-pipeline
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate article with Gemini (with retry)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          # Gemini 3.8 is currently returning intermittent 503 capacity errors.
          # Use the stable Gemini 3.5 Flash endpoint for this publishing pipeline.
          sed -i 's/gemini-3.8-flash/gemini-3.5-flash/g' scripts/generate-article.mjs
          for attempt in 1 2 3 4 5; do
            echo "Gemini generation attempt $attempt/5"
            node scripts/generate-article.mjs
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 15))
              echo "Gemini request failed. Retrying in ${delay}s..."
              sleep "$delay"
            else
              echo "Gemini generation failed after 5 attempts."
              exit "$status"
            fi
          done

      - name: Rebuild AI knowledge index and sitemap
        run: node scripts/build-site-index.mjs

      - name: Check for generated changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new article was generated."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Generated content changes detected."
          fi

      - name: Validate generated site files
        if: steps.changes.outputs.changed == 'true'
        run: |
          node --check scripts/generate-article.mjs
          node --check scripts/build-site-index.mjs
          test -s sitemap.xml
          test -s tutorials.html
          test -s api/knowledge.json
          echo "Site validation passed."

      - name: Commit generated content
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Dynexal AI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles tutorials.html sitemap.xml api/knowledge.json content-queue.json assets/tutorial-diagrams
          git commit -m "Auto-publish Dynexal AI article"
          git push origin main

      - name: Configure GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
