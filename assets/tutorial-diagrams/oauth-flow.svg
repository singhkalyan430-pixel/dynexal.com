<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">OAuth 2.0 flow for Business Central integrations</title><desc id="desc">An application authenticates with Microsoft identity platform and uses an access token to call Business Central.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#1d4ed8"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs><rect width="1200" height="440" rx="28" fill="#f7f9fc"/><text x="70" y="58" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#172033">OAuth 2.0 Integration Flow</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="70" y="130" width="250" height="155" rx="18" fill="#fff" stroke="#dfe6ef"/><text x="195" y="190" font-size="19" font-weight="700" fill="#172033">Client App</text><text x="195" y="222" font-size="14" fill="#526176">Requests authorization</text><text x="195" y="246" font-size="14" fill="#526176">for Business Central</text><rect x="475" y="130" width="250" height="155" rx="18" fill="#fff" stroke="#dfe6ef"/><text x="600" y="190" font-size="19" font-weight="700" fill="#172033">Microsoft Identity</text><text x="600" y="222" font-size="14" fill="#526176">Authenticates client</text><text x="600" y="246" font-size="14" fill="#526176">and issues token</text><rect x="880" y="130" width="250" height="155" rx="18" fill="#fff" stroke="#dfe6ef"/><text x="1005" y="190" font-size="19" font-weight="700" fill="#172033">Business Central</text><text x="1005" y="222" font-size="14" fill="#526176">Validates access token</text><text x="1005" y="246" font-size="14" fill="#526176">and serves API</text></g><g stroke="url(#g)" stroke-width="6" fill="none" stroke-linecap="round"><path d="M330 207h135"/><path d="M735 207h135"/></g><g fill="#1d4ed8"><path d="M453 195l18 12-18 12z"/><path d="M858 195l18 12-18 12z"/></g><rect x="285" y="345" width="630" height="48" rx="24" fill="#eaf2ff"/><text x="600" y="375" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#315fc9">Access token → Authorization: Bearer &lt;token&gt; → API request</text></svg>