<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc"><title id="title">Business Central webhook flow</title><desc id="desc">Business Central sends a notification to an external subscriber after a resource changes.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#1d4ed8"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs><rect width="1200" height="460" rx="28" fill="#f7f9fc"/><text x="70" y="58" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#172033">Business Central Webhook Flow</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="80" y="130" width="250" height="155" rx="18" fill="#fff" stroke="#dfe6ef"/><text x="205" y="190" font-size="19" font-weight="700" fill="#172033">1. Subscribe</text><text x="205" y="222" font-size="14" fill="#526176">External app registers</text><text x="205" y="246" font-size="14" fill="#526176">a webhook endpoint</text><rect x="475" y="130" width="250" height="155" rx="18" fill="#fff" stroke="#dfe6ef"/><text x="600" y="190" font-size="19" font-weight="700" fill="#172033">2. Data Changes</text><text x="600" y="222" font-size="14" fill="#526176">Customer / order / item</text><text x="600" y="246" font-size="14" fill="#526176">resource changes</text><rect x="870" y="130" width="250" height="155" rx="18" fill="#fff" stroke="#dfe6ef"/><text x="995" y="190" font-size="19" font-weight="700" fill="#172033">3. Notification</text><text x="995" y="222" font-size="14" fill="#526176">Business Central calls</text><text x="995" y="246" font-size="14" fill="#526176">the subscriber URL</text></g><g stroke="url(#g)" stroke-width="6" fill="none" stroke-linecap="round"><path d="M340 207h120"/><path d="M735 207h120"/></g><g fill="#1d4ed8"><path d="M448 195l18 12-18 12z"/><path d="M843 195l18 12-18 12z"/></g><rect x="270" y="350" width="660" height="52" rx="26" fill="#eaf2ff"/><text x="600" y="383" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#315fc9">Your service receives the notification → fetch/reconcile details → process safely</text></svg>