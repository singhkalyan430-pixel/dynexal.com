<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Business Central API request flow</title><desc id="desc">External application sends a request to Business Central API, AL logic processes it, and a response is returned.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#1d4ed8"/><stop offset="1" stop-color="#06b6d4"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".18"/></filter></defs><rect width="1200" height="420" rx="28" fill="#f7f9fc"/><text x="70" y="58" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#172033">Business Central API Request Flow</text><g filter="url(#s)"><rect x="70" y="130" width="220" height="150" rx="18" fill="#fff"/><rect x="350" y="130" width="220" height="150" rx="18" fill="#fff"/><rect x="630" y="130" width="220" height="150" rx="18" fill="#fff"/><rect x="910" y="130" width="220" height="150" rx="18" fill="#fff"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><text x="180" y="185" font-size="19" font-weight="700" fill="#172033">External App</text><text x="180" y="218" font-size="14" fill="#526176">Website / Shopify / Client</text><text x="460" y="185" font-size="19" font-weight="700" fill="#172033">Business Central API</text><text x="460" y="218" font-size="14" fill="#526176">Endpoint + authentication</text><text x="740" y="185" font-size="19" font-weight="700" fill="#172033">AL Logic</text><text x="740" y="218" font-size="14" fill="#526176">Validation + business rules</text><text x="1020" y="185" font-size="19" font-weight="700" fill="#172033">Response</text><text x="1020" y="218" font-size="14" fill="#526176">JSON + HTTP status</text></g><g stroke="url(#g)" stroke-width="6" fill="none" stroke-linecap="round"><path d="M295 205h45"/><path d="M575 205h45"/><path d="M855 205h45"/></g><g fill="#1d4ed8"><path d="M338 193l18 12-18 12z"/><path d="M618 193l18 12-18 12z"/><path d="M898 193l18 12-18 12z"/></g><text x="600" y="350" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#526176">Request → API → AL processing → Response</text></svg>