<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">RDLC report rendering flow in Business Central</title><desc id="desc">Business Central report data and layout are combined to render an RDLC report for the user.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#1d4ed8"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs><rect width="1200" height="440" rx="28" fill="#f7f9fc"/><text x="70" y="58" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#172033">Business Central RDLC Report Flow</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="70" y="130" width="240" height="155" rx="18" fill="#fff" stroke="#dfe6ef"/><text x="190" y="190" font-size="19" font-weight="700" fill="#172033">Report Object</text><text x="190" y="222" font-size="14" fill="#526176">DataItem + columns</text><text x="190" y="246" font-size="14" fill="#526176">+ filters</text><rect x="350" y="130" width="240" height="155" rx="18" fill="#fff" stroke="#dfe6ef"/><text x="470" y="190" font-size="19" font-weight="700" fill="#172033">Dataset</text><text x="470" y="222" font-size="14" fill="#526176">Data prepared by</text><text x="470" y="246" font-size="14" fill="#526176">Business Central</text><rect x="630" y="130" width="240" height="155" rx="18" fill="#fff" stroke="#dfe6ef"/><text x="750" y="190" font-size="19" font-weight="700" fill="#172033">RDLC Layout</text><text x="750" y="222" font-size="14" fill="#526176">Expressions + groups</text><text x="750" y="246" font-size="14" fill="#526176">+ formatting</text><rect x="910" y="130" width="220" height="155" rx="18" fill="#fff" stroke="#dfe6ef"/><text x="1020" y="190" font-size="19" font-weight="700" fill="#172033">Output</text><text x="1020" y="222" font-size="14" fill="#526176">Preview / PDF /</text><text x="1020" y="246" font-size="14" fill="#526176">print</text></g><g stroke="url(#g)" stroke-width="6" fill="none" stroke-linecap="round"><path d="M320 207h20"/><path d="M600 207h20"/><path d="M880 207h20"/></g><g fill="#1d4ed8"><path d="M330 195l18 12-18 12z"/><path d="M610 195l18 12-18 12z"/><path d="M890 195l18 12-18 12z"/></g><rect x="250" y="345" width="700" height="48" rx="24" fill="#eaf2ff"/><text x="600" y="375" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#315fc9">If the dataset is correct but the layout is wrong, the report can still appear blank or incorrect.</text></svg>