<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Publicly verify a Dynexal Technologies Business Central certification certificate."><title>Verify Certificate | Dynexal Technologies</title><link rel="stylesheet" href="styles.css"><style>.verify{min-height:calc(100vh - 82px);background:#061329;color:#fff;padding:80px 0}.box{max-width:650px;margin:auto;background:#0b2038;border:1px solid #284a68;border-radius:20px;padding:35px;box-shadow:0 20px 60px #0006}.box h1{font-size:44px;letter-spacing:-2px}.box input{width:100%;padding:15px;border-radius:10px;border:1px solid #41617c;background:#08192d;color:#fff;font-size:18px;text-transform:uppercase}.btn{margin-top:15px;padding:14px 20px;border:0;border-radius:10px;background:#1599ff;color:#fff;font-weight:800;cursor:pointer}.card{margin-top:22px;padding:22px;border-radius:14px;background:#07172a;border:1px solid #31516e}.valid{color:#5ee6a4}.invalid{color:#ff8d8d}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="logo" href="index.html"><span class="logo-mark"></span><span class="logo-copy"><strong>Dynexal Technologies</strong><small>Learn | Build | Integrate | Grow</small></span></a><nav class="nav"><a href="certification.html">Certification</a><a class="active" href="verify.html">Verify Certificate</a></nav></div></header><main class="verify"><div class="container box"><div style="color:#67d7ff;font-weight:800;letter-spacing:2px">PUBLIC VERIFICATION</div><h1>Verify a Dynexal Certificate</h1><p style="color:#a9bfd3">Enter the certificate number shown on the certificate.</p><input id="id" placeholder="DYN-BCFD-2026-ABC123"><button class="btn" id="go">Verify Certificate</button><div id="out"></div></div></main><script>(async()=>{const p=new URLSearchParams(location.search).get("id");if(p){document.getElementById("id").value=p;document.getElementById("go").click()}})();document.getElementById("go").onclick=async()=>{const id=document.getElementById("id").value.trim();const out=document.getElementById("out");out.innerHTML="<div class='card'>Checking…</div>";try{const r=await fetch("/api/certificate-verify?id="+encodeURIComponent(id));const d=await r.json();if(d.verified){const c=d.certificate;const safe=value=>String(value??"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));out.innerHTML="<div class='card'><h2 class='valid'>✓ Valid Certificate</h2><p><b>Certificate:</b> "+safe(c.certificate_number)+"</p><p><b>Candidate:</b> "+safe(c.candidate_name)+"</p><p><b>Certification:</b> "+safe(c.certification_name)+"</p><p><b>Issued:</b> "+safe(new Date(c.issued_at).toLocaleDateString())+"</p></div>"}else out.innerHTML="<div class='card'><h2 class='invalid'>Certificate not verified</h2><p>"+(d.error||"No matching certificate was found.")+"</p></div>"}catch(e){out.innerHTML="<div class='card'><h2 class='invalid'>Verification unavailable</h2></div>"}};</script></body></html>
