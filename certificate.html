<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Public Dynexal Technologies Business Central certification certificate."><title>Dynexal Certificate | Dynexal Technologies</title><style>body{margin:0;background:#eef3f8;font-family:Georgia,serif;color:#15283b}.cert{max-width:900px;margin:45px auto;padding:70px;background:#fff;border:10px solid #0b2945;box-shadow:0 20px 60px #0002;text-align:center}.brand{font:800 14px Arial;letter-spacing:3px;color:#1599ff}.cert h1{font-size:52px;margin:20px 0}.name{font-size:38px;font-weight:700;border-bottom:1px solid #a9b7c6;display:inline-block;padding:0 35px 10px}.small{font:14px Arial;color:#61758a}.num{font:800 18px Arial;letter-spacing:2px;margin-top:28px}.btn{font:700 14px Arial;color:#fff;background:#1599ff;padding:12px 18px;border-radius:8px;text-decoration:none;display:inline-block;margin-top:22px}@media(max-width:600px){.cert{margin:15px;padding:35px 18px}.cert h1{font-size:38px}.name{font-size:27px;padding:0 8px 8px}}</style></head><body><main class="cert"><div class="brand">DYNEXAL TECHNOLOGIES</div><h1>Certificate of Achievement</h1><p class="small">This certificate is awarded to</p><div class="name" id="name">Loading...</div><p class="small">for successfully passing</p><h2 id="course">Dynexal Business Central Developer — Foundation</h2><p class="small">Certificate Number</p><div class="num" id="number">—</div><p class="small" id="issued"></p><a class="btn" id="verify" href="verify.html">Verify Certificate</a></main><script>(async function(){var id=new URLSearchParams(location.search).get("id");if(!id)return;try{var r=await fetch("/api/certificate-verify?id="+encodeURIComponent(id));var d=await r.json();if(!d.verified)throw new Error("not verified");var c=d.certificate;document.getElementById("name").textContent=c.candidate_name;document.getElementById("course").textContent=c.certification_name;document.getElementById("number").textContent=c.certificate_number;document.getElementById("issued").textContent="Issued "+new Date(c.issued_at).toLocaleDateString();document.getElementById("verify").href="verify.html?id="+encodeURIComponent(c.certificate_number)}catch(e){document.getElementById("name").textContent="Certificate not verified";document.getElementById("course").textContent="Please verify the certificate number."}})();</script></body></html>
